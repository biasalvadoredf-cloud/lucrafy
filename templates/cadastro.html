<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Lucrafy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>

    <div class="cadastro">

        <h2>Criar conta</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('cadastro') }}" method="POST" class="form-cadastro">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Nome completo" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="E-mail" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Senha" required>

            <label for="mao_de_obra">Valor da mão de obra (R$)</label>
            <input type="number" id="mao_de_obra" name="mao_de_obra" placeholder="Ex: 25,00" min="0" step="0.01" required>

            <button type="submit">Cadastrar</button>

            <p>Já possui uma uma conta?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

        </form>

    </div>

</body>
</html>
