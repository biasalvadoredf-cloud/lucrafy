
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuário</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="cadastro">

        <h2>Editar usuário</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('editar', id=usuario[0]) }}" method="POST" class="form-cadastro">

            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" value="{{ usuario[1] }}" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ usuario[2] }}" required>

            <label for="mao_de_obra">Valor da mão de obra (R$)</label>
            <input type="number" id="mao_de_obra" name="mao_de_obra" value="{{ usuario[3] }}" min="0" step="0.01" required>

            <button type="submit">Salvar alterações</button>

        </form>

        <a href="{{ url_for('home') }}">Voltar</a>

    </div>

</body>
</html>
